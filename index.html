<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatChit - Ứng dụng Nhắn tin Realtime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-light: #f8fafc;
            --surface-dark: #1e293b;
            --surface-light: #ffffff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            max-height: 800px;
            background: var(--surface-light);
            border-radius: 20px;
            box-shadow: var(--shadow-lg), 0 25px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Header */
        .header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-light);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sound-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(to bottom, #fafbfc 0%, #f0f4f8 100%);
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .messages-area::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
            max-width: 85%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 14px;
            word-wrap: break-word;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            margin-left: 10px;
        }

        .message:not(.own) .message-content {
            margin-right: 10px;
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message.own .message-sender {
            color: rgba(255, 255, 255, 0.8);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            padding: 0 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-light);
            gap: 15px;
        }

        .empty-icon {
            font-size: 48px;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .empty-state p {
            font-size: 14px;
            text-align: center;
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            color: var(--text-dark);
        }

        input[type="text"]::placeholder {
            color: var(--text-light);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: var(--shadow-md);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 15px;
            }

            .header-title h1 {
                font-size: 20px;
            }

            .messages-area {
                padding: 15px;
                gap: 10px;
            }

            .message {
                max-width: 95%;
            }

            .input-area {
                padding: 12px 15px;
                gap: 8px;
            }

            .user-badge {
                font-size: 11px;
                padding: 6px 12px;
            }

            .header-right {
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 12px;
                height: 100vh;
                max-height: none;
            }

            .header {
                padding: 12px;
                gap: 8px;
            }

            .header-left {
                gap: 8px;
            }

            .header-icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .header-title h1 {
                font-size: 18px;
            }

            .header-title p {
                font-size: 10px;
            }

            .user-badge {
                display: none;
            }

            .messages-area {
                padding: 12px;
            }

            .message-content {
                padding: 10px 12px;
                font-size: 13px;
            }

            .input-area {
                padding: 10px 12px;
                gap: 6px;
            }

            input[type="text"] {
                padding: 6px;
                font-size: 13px;
            }

            .send-btn {
                padding: 8px 16px;
                font-size: 16px;
            }
        }

        /* Loading state */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .loading:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .status-message {
            text-align: center;
            color: var(--text-light);
            font-size: 12px;
            padding: 8px;
            background: #f0f4f8;
            border-radius: 8px;
            margin: 0 20px;
        }

        .notification-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            animation: slideInRight 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">💬</div>
                <div class="header-title">
                    <h1>ChatChit</h1>
                    <p id="connection-status">Đang kết nối...</p>
                </div>
            </div>
            <div class="header-right">
                <div class="user-badge">
                    <span class="status-indicator"></span>
                    <span id="current-user">User</span>
                </div>
                <button class="sound-toggle" id="sound-toggle" title="Bật/Tắt âm thanh">🔊</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="messages-area" id="messages-area">
                <div class="empty-state">
                    <div class="empty-icon">👋</div>
                    <p>Bắt đầu cuộc hội thoại mới</p>
                    <p style="font-size: 12px; opacity: 0.5;">Mở trang này trên thiết bị khác để bắt đầu chat</p>
                </div>
            </div>
            <div class="status-message" id="status-message" style="display: none;"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Nhập tin nhắn..." 
                    autocomplete="off"
                >
            </div>
            <button class="send-btn" id="send-btn">📤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            onValue,
            orderByChild,
            query,
            limitToLast,
            remove,
            get
        } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBsg11cCu_lL9QRSkwbPF3w3YY_Lbyqdv4",
            authDomain: "chatchit-26d76.firebaseapp.com",
            databaseURL: "https://chatchit-26d76-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatchit-26d76",
            storageBucket: "chatchit-26d76.firebasestorage.app",
            messagingSenderId: "177758324953",
            appId: "1:177758324953:web:6210179ac6b795e2a216c8"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Variables
        let currentUser = null;
        let soundEnabled = true;
        let messageCount = 0;
        const MAX_MESSAGES = 50;
        const DB_PATH = 'messages';

        // Get or create user ID
        function getOrCreateUser() {
            let userId = sessionStorage.getItem('chatUserId');
            if (!userId) {
                userId = 'User_' + Math.random().toString(36).substr(2, 9).toUpperCase();
                sessionStorage.setItem('chatUserId', userId);
            }
            return userId;
        }

        // Initialize
        currentUser = getOrCreateUser();
        document.getElementById('current-user').textContent = currentUser.replace('User_', '');

        // Elements
        const messagesArea = document.getElementById('messages-area');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const connectionStatus = document.getElementById('connection-status');
        const soundToggle = document.getElementById('sound-toggle');
        const statusMessage = document.getElementById('status-message');

        // Sound toggle
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        });

        // Send message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const messagesRef = ref(database, DB_PATH);
            push(messagesRef, {
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            });

            messageInput.value = '';
            messageInput.focus();
        }

        // Send button click
        sendBtn.addEventListener('click', sendMessage);

        // Send on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Load messages
        function loadMessages() {
            const messagesRef = query(
                ref(database, DB_PATH),
                limitToLast(MAX_MESSAGES)
            );

            onValue(messagesRef, (snapshot) => {
                const data = snapshot.val();
                
                if (!data) {
                    messagesArea.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">👋</div>
                            <p>Bắt đầu cuộc hội thoại mới</p>
                            <p style="font-size: 12px; opacity: 0.5;">Mở trang này trên thiết bị khác để bắt đầu chat</p>
                        </div>
                    `;
                    connectionStatus.textContent = '✅ Kết nối thành công';
                    return;
                }

                const messages = Object.entries(data).map(([key, value]) => ({
                    id: key,
                    ...value
                }));

                // Sort by timestamp
                messages.sort((a, b) => a.timestamp - b.timestamp);

                // Check if we need to clean up (more than MAX_MESSAGES)
                if (messages.length > MAX_MESSAGES) {
                    const toDelete = messages.slice(0, messages.length - MAX_MESSAGES);
                    toDelete.forEach(msg => {
                        remove(ref(database, `${DB_PATH}/${msg.id}`));
                    });
                    return; // Will trigger another render
                }

                // Render messages
                const currentScroll = messagesArea.scrollTop;
                const isNearBottom = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight < 100;

                messagesArea.innerHTML = messages.map(msg => {
                    const isOwn = msg.sender === currentUser;
                    const time = new Date(msg.timestamp).toLocaleTimeString('vi-VN', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    return `
                        <div class="message ${isOwn ? 'own' : ''}">
                            <div>
                                ${!isOwn ? `<div class="message-sender">${msg.sender.replace('User_', '')}</div>` : ''}
                                <div class="message-content">${escapeHtml(msg.text)}</div>
                                <div class="message-time">${time}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                connectionStatus.textContent = '✅ Kết nối thành công';

                // Scroll to bottom if was near bottom
                if (isNearBottom || currentScroll === 0) {
                    setTimeout(() => {
                        messagesArea.scrollTop = messagesArea.scrollHeight;
                    }, 0);
                }

                // Play sound for new messages
                checkAndPlaySound(messages.length);
            });
        }

        // Check and play sound for new messages
        let lastMessageCount = 0;
        function checkAndPlaySound(count) {
            if (count > lastMessageCount && soundEnabled && lastMessageCount > 0) {
                playNotificationSound();
            }
            lastMessageCount = count;
        }

        // Play notification sound
        function playNotificationSound() {
            // Create a simple beep using Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start loading messages
        loadMessages();

        // Keep connection alive
        window.addEventListener('beforeunload', () => {
            // Optional: clean up
        });
    </script>
</body>
</html>
